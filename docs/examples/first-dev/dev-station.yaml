schema: lxm/config/v2
include:
  - _base.yaml
name: dev-station
status: present
state: running
image: ubuntu:22.04
groups: [dev]
user: ubuntu
sudo: false
inject_ssh_keys: true
mounts:
  - source: /tmp/projects
    path: /workspace
networks:
  - name: eth0
    ipv4: 10.171.13.200
    parent: lxdbr0
recipes:
  - run_as: root
    scripts:
      - recipes/setup.sh
wait:
  cloud_init: 5m
  required: true
