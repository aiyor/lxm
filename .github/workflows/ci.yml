name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pinned rather than '1.27': golangci-lint v2.13.2 (built with
          # go1.27.0) cannot decode the stdlib export data emitted by Go
          # 1.27.3 (version 5 > maximum supported 4), which makes the lint
          # step fail before analysing any project package. Bump this pin (and
          # golangci-lint) together once the lint release supports 1.27.3.
          go-version: '1.27.1'
          cache: true

      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -v -race -cover ./...
