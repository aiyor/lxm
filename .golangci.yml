version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - nilerr
    - noctx
    - gocritic
    - gosec
    - forcetypeassert
    - unconvert
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - syscall.Flock
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - staticcheck
        path: internal/lxd/fake\.go
      - linters:
          - gosec
        text: "G204: Subprocess launched with a potential tainted input or cmd arguments"
      - linters:
          - gosec
        text: "G304: File path provided as taint input"
      - linters:
          - gosec
        text: "G306: Expect WriteFile permissions to be 0600 or less"
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - forcetypeassert
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
