version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - nilerr
    - noctx
    - gocritic
    - gosec
    - forcetypeassert
    - unconvert
    - misspell
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - syscall.Flock
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - staticcheck
        path: internal/lxd/fake\.go
      - linters:
          - staticcheck
        path: internal/lxd/fake_network\.go
      - linters:
          - staticcheck
        path: internal/lxd/fake_storage\.go
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - forcetypeassert
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
